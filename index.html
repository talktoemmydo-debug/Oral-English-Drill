<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Vowel Quest — British Pronunciation Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1726'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%232dd4bf' font-family='sans-serif'%3E%C9%99%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1322; --bg2:#0e1726; --panel:#152238; --panel2:#1c2c49; --edge:#2e4468;
  --text:#f1f5f9; --soft:#cbd5e1; --muted:#8ca3bf;
  --teal:#2dd4bf; --amber:#fbbf24; --violet:#a78bfa; --blue:#60a5fa; --rose:#fb7185;
  --good:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,var(--bg2),var(--bg));color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;min-height:100dvh;touch-action:manipulation}
#app{max-width:680px;margin:0 auto;padding:10px 14px calc(24px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.b{background:var(--panel2);border:1px solid var(--edge);color:var(--text);border-radius:14px;
  padding:13px 18px;font-size:16px;font-weight:600}
.b:active{transform:scale(.97)}
.b.primary{background:#0f766e;border-color:#14b8a6}
.b.danger{background:#7f1d1d;border-color:#b91c1c}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:14px 16px;margin:10px 0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 12px}
.topbar .meta{color:var(--muted);font-size:14px;font-weight:600}
.hero{text-align:center;margin:18px 0 16px;padding:22px 12px;background:var(--panel);
  border:1px solid var(--edge);border-radius:22px}
.hkick{color:var(--teal);letter-spacing:3px;font-size:12px;font-weight:700}
.hero h1{margin:8px 0 4px;font-size:44px;letter-spacing:1px}
.hsub{color:var(--muted);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:16px 12px;
  color:var(--text);text-align:left}
.tile:active{transform:scale(.97)}
.tic{font-size:26px}
.tt{font-size:18px;font-weight:700;margin-top:6px}
.td{font-size:13px;color:var(--muted);margin-top:2px}
.lvl{display:flex;align-items:center;gap:14px}
.lvl:active{transform:scale(.98)}
.lvl.locked{opacity:.55}
.lnum{font-size:26px;font-weight:800;color:var(--teal);width:34px;text-align:center}
.lvlmain{flex:1}
.lt{font-size:18px;font-weight:700}
.ld{font-size:13px;color:var(--muted);margin-top:2px}
.stars{color:var(--amber);font-size:18px;letter-spacing:1px;white-space:nowrap}
.rowbtns{display:flex;gap:10px;margin:10px 0}
.rowbtns .b{flex:1}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:18px 0 6px}
.qtitle{color:var(--muted);font-size:15px;font-weight:700;letter-spacing:.5px;text-align:center;margin-top:4px}
.qword{font-size:46px;font-weight:800;text-align:center;margin:12px 0 2px;word-break:break-word}
.qword u{text-decoration-thickness:4px;text-decoration-color:var(--amber)}
.qipa{text-align:center;color:var(--muted);font-size:18px;margin-bottom:6px}
.playrow{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--panel2);border:2px solid var(--edge);color:var(--text);border-radius:16px;
  padding:14px 10px;min-height:78px;font-size:16px}
.opt:active{transform:scale(.97)}
.vsym{font-size:30px;font-weight:800}
.vsub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.pword{font-size:30px;font-weight:800}
.pipa{font-size:15px;color:var(--muted);margin-top:3px}
.ppat{font-size:26px;font-weight:800;letter-spacing:2px}
.fopt{font-size:16.5px;font-weight:600;line-height:1.35}
.opt.correct{border-color:var(--good);background:#12331f}
.opt.wrong{border-color:var(--bad);background:#3a1620}
.opt.dim{opacity:.5}
.tbar{height:9px;background:#16223a;border-radius:5px;overflow:hidden;margin-top:18px;position:relative}
.tfill{height:100%;width:100%;background:var(--good);transform-origin:left center;transform:scaleX(1);will-change:transform}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px}
.scorechip{font-weight:800;font-size:16px}
.streakchip{font-weight:800;font-size:15px;color:var(--amber)}
.dots{display:flex;gap:4px;justify-content:center;margin:8px 0}
.dot{width:9px;height:9px;border-radius:50%;background:#26385c}
.dot.on{background:var(--teal)}
.dot.bad{background:var(--bad)}
.fb{border-radius:16px;padding:12px 14px;margin-top:14px;font-weight:700}
.fb.ok{background:#0d2b1e;border:2px solid var(--good)}
.fb.bad{background:#331119;border:2px solid var(--bad)}
.fb .why{font-weight:500;font-size:14px;color:var(--soft);margin-top:4px}
.bigscore{font-size:52px;font-weight:800;text-align:center;margin:6px 0}
.bigstars{font-size:44px;text-align:center;color:var(--amber);letter-spacing:6px;margin:4px 0}
.acc{text-align:center;color:var(--muted);font-size:16px;margin-bottom:8px}
.miss{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--edge);
  border-radius:12px;padding:8px 12px;margin:6px 0}
.miss .mw{flex:1}
.miss .mi{color:var(--muted);font-size:13px}
.mini{background:var(--panel);border:1px solid var(--edge);color:var(--text);border-radius:10px;
  padding:8px 10px;font-size:14px;font-weight:700}
.vcard{display:flex;gap:14px;align-items:center}
.vsym-big{font-size:44px;font-weight:800;width:110px;text-align:center}
.vinfo{flex:1}
.vname{font-size:18px;font-weight:800}
.vtag{font-size:13px;color:var(--muted)}
.vex{margin-top:4px}
.note{color:var(--soft);font-size:14.5px;line-height:1.5}
.h2{font-size:20px;font-weight:800;margin:18px 0 6px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.setlab{font-size:16px;font-weight:700}
.segs{display:flex;gap:6px}
.seg{background:var(--panel2);border:1px solid var(--edge);color:var(--muted);border-radius:10px;
  padding:8px 12px;font-size:14px;font-weight:700}
.seg.on{background:#0f766e;border-color:#14b8a6;color:#fff}
.back{background:none;border:none;color:var(--teal);font-size:16px;font-weight:700;padding:6px 2px}
@media (max-width:390px){ .hero h1{font-size:36px} .qword{font-size:38px} }
</style>
</head>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------------- audio engine ---------------- */
let AC = null;
function ac() {
  if (!AC) {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) AC = new AudioCtx();
    } catch (e) {}
  }
  if (AC && AC.state === 'suspended') {
    AC.resume().catch(function(){});
  }
  return AC;
}

function blip(kind) {
  try {
    const a = ac();
    if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g);
    g.connect(a.destination);
    if (kind === 'ok') {
      o.type = 'sine';
      o.frequency.setValueAtTime(660, t);
      o.frequency.setValueAtTime(990, t + 0.09);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.start(t);
      o.stop(t + 0.3);
    } else if (kind === 'bad') {
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(170, t);
      o.frequency.linearRampToValueAtTime(80, t + 0.32);
      g.gain.setValueAtTime(0.10, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
      o.start(t);
      o.stop(t + 0.36);
    } else {
      o.type = 'sine';
      o.frequency.setValueAtTime(520, t);
      g.gain.setValueAtTime(0.07, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.start(t);
      o.stop(t + 0.14);
    }
  } catch (e) {}
}

/* Web Audio pre-decoding & cache (zero lag on PC/Android/iOS) */
const AUDIO_BUFFERS = {};
const AUDIO_ELEMENTS = {};

function base64ToArrayBuffer(base64) {
  const raw = base64.replace(/^data:audio\/[^;]+;base64,/, '');
  const binary = window.atob(raw);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

function decodeStudioBuffer(key) {
  if (AUDIO_BUFFERS[key]) return Promise.resolve(AUDIO_BUFFERS[key]);
  if (!AUDIO[key]) return Promise.resolve(null);
  const ctx = ac();
  if (!ctx || !ctx.decodeAudioData) return Promise.resolve(null);
  try {
    const arrayBuf = base64ToArrayBuffer(AUDIO[key]);
    return new Promise(function(resolve) {
      ctx.decodeAudioData(arrayBuf, function(decoded) {
        AUDIO_BUFFERS[key] = decoded;
        resolve(decoded);
      }, function() {
        resolve(null);
      });
    });
  } catch (e) {
    return Promise.resolve(null);
  }
}

function playAudioBuffer(buf, slow) {
  const ctx = ac();
  if (!ctx) return false;
  try {
    if (ctx.state === 'suspended') ctx.resume().catch(function(){});
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const rate = (slow ? 0.7 : 1) * (SETTINGS.rate || 1);
    src.playbackRate.setValueAtTime(rate, ctx.currentTime);
    src.connect(ctx.destination);
    src.start(0);
    return true;
  } catch (e) {
    return false;
  }
}

function getAudioElement(key) {
  if (!AUDIO_ELEMENTS[key] && AUDIO[key]) {
    try {
      const el = new Audio(AUDIO[key]);
      el.preload = 'auto';
      AUDIO_ELEMENTS[key] = el;
    } catch (e) {}
  }
  return AUDIO_ELEMENTS[key];
}

function playAudioElement(key, slow) {
  const el = getAudioElement(key);
  if (!el) return false;
  try {
    el.pause();
    el.currentTime = 0;
    el.playbackRate = (slow ? 0.7 : 1) * (SETTINGS.rate || 1);
    const p = el.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function(){});
    }
    return true;
  } catch (e) {
    return false;
  }
}

/* ---------------- Speech Synthesis cross-platform ---------------- */
let VOICES = [];
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  try {
    const list = speechSynthesis.getVoices();
    if (list && list.length > 0) {
      VOICES = list;
    }
  } catch (e) {}
}

if ('speechSynthesis' in window) {
  loadVoices();
  if (typeof speechSynthesis.addEventListener === 'function') {
    speechSynthesis.addEventListener('voiceschanged', loadVoices);
  } else {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
}

function gbVoice() {
  if (!VOICES.length) loadVoices();
  // 1. Look for British / UK voice
  const gb = VOICES.filter(function(v) {
    const l = (v.lang || '').replace('_', '-').toLowerCase();
    const n = (v.name || '').toLowerCase();
    return l === 'en-gb' || l === 'en-uk' || n.includes('british') || n.includes('united kingdom') ||
           n.includes('daniel') || n.includes('kate') || n.includes('serena') || n.includes('arthur') ||
           n.includes('george') || n.includes('hazel') || n.includes('susan') || n.includes('oliver') ||
           n.includes('uk english') || n.includes('en-gb');
  });
  if (gb.length > 0) return gb[0];

  // 2. Fallback to any English voice (en-US, en-AU, etc.)
  const anyEn = VOICES.filter(function(v) {
    const l = (v.lang || '').toLowerCase();
    return l.startsWith('en');
  });
  if (anyEn.length > 0) return anyEn[0];

  // 3. Fallback to default or first available voice
  return VOICES.find(function(v) { return v.default; }) || VOICES[0] || null;
}

let activeUtterance = null;
function speakSynthesis(w, slow) {
  if (!('speechSynthesis' in window)) return;
  try {
    // Only cancel if actively speaking to prevent Chromium Android bug
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      speechSynthesis.cancel();
    }
    const cleanWord = String(w).replace(/\./g, '').trim();
    const u = new SpeechSynthesisUtterance(cleanWord);
    u.lang = 'en-GB';
    const v = gbVoice();
    if (v) {
      u.voice = v;
      if (v.lang) u.lang = v.lang;
    }
    u.rate = (slow ? 0.65 : 0.92) * (SETTINGS.rate || 1);
    u.pitch = 1.0;
    u.volume = 1.0;

    // Retain global reference to avoid V8 garbage collection mid-speech on Android/PC
    activeUtterance = u;
    u.onend = function() { if (activeUtterance === u) activeUtterance = null; };
    u.onerror = function() { if (activeUtterance === u) activeUtterance = null; };

    if (speechSynthesis.paused) {
      speechSynthesis.resume();
    }
    speechSynthesis.speak(u);
  } catch (e) {
    activeUtterance = null;
  }
}

function canSpeak(w) {
  const key = String(w).toLowerCase();
  if (SETTINGS.voice !== 'browser' && AUDIO[key]) return true;
  return ('speechSynthesis' in window);
}

function speakWord(w, slow) {
  if (!w) return;
  const key = String(w).toLowerCase().trim();

  if (SETTINGS.voice !== 'browser' && AUDIO[key]) {
    // 1. Try instant Web Audio buffer
    if (AUDIO_BUFFERS[key]) {
      playAudioBuffer(AUDIO_BUFFERS[key], slow);
      return;
    }
    // 2. Decode on demand or fallback to HTMLAudioElement
    decodeStudioBuffer(key).then(function(buf) {
      if (buf) {
        playAudioBuffer(buf, slow);
      } else {
        playAudioElement(key, slow);
      }
    }).catch(function() {
      playAudioElement(key, slow);
    });
    return;
  }

  // Fallback to cross-platform speech synthesis
  speakSynthesis(w, slow);
}

/* Universal Audio Unlock & Voice Pre-loader on user gesture */
let audioPrimed = false;
function primeAudio() {
  if (audioPrimed) return;
  audioPrimed = true;
  try {
    const ctx = ac();
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(function(){});
  } catch (e) {}
  loadVoices();
  // Decode studio recordings in background for instant 0ms response
  try {
    Object.keys(AUDIO).forEach(function(k) {
      decodeStudioBuffer(k);
    });
  } catch (e) {}
}

['pointerdown', 'touchstart', 'touchend', 'click', 'keydown'].forEach(function(evt) {
  document.addEventListener(evt, primeAudio, { passive: true, once: false });
});

/* ---------------- question builders ---------------- */
function qSound(word,vowelsAllowed){
  const w=word[0],ipa=word[1],v=word[2];
  const opts=vowelsAllowed.map(function(k){return{
    html:'<div class="vsym" style="color:'+VOW[k].color+'">/'+k+'/</div><div class="vsub">'+VOW[k].ex+' · '+VOW[k].tag+'</div>',
    ok:k===v};});
  return{kind:'sound',speak:w,title:'Listen — which vowel do you hear?',opts,
    a:vowelsAllowed.indexOf(v),
    explain:'\u201C'+w+'\u201D '+ipa+' \u2192 /'+v+'/ — '+VOW[v].name+', '+VOW[v].tag};
}
function qPair(pair){
  const spoken=Math.random()<0.5?pair[0]:pair[1];
  const opts=[pair[0],pair[1]].map(function(w){const o=wobj(w);
    return{html:'<div class="pword" style="color:'+VOW[o[2]].color+'">'+esc(w)+'</div><div class="pipa">'+o[1]+'</div>',ok:w===spoken};});
  shuffle(opts);
  const sw=wobj(spoken);
  return{kind:'pair',speak:spoken,title:'Which word did you hear?',opts,
    a:opts.findIndex(function(o){return o.ok;}),
    explain:'That was \u201C'+spoken+'\u201D '+sw[1]+' — /'+sw[2]+'/, '+VOW[sw[2]].tag};
}
function qSpell(word,family){
  const w=word[0],ipa=word[1],v=word[2],pat=word[3];
  const pats=family==='dress'?DRESS_PATS:NURSE_PATS;
  const i=w.toLowerCase().indexOf(pat);
  const wordHtml=i>=0?esc(w.slice(0,i))+'<u>'+esc(w.slice(i,i+pat.length))+'</u>'+esc(w.slice(i+pat.length)):esc(w);
  const opts=pats.map(function(p){return{html:'<div class="ppat">'+p.toUpperCase()+'</div>',ok:p===pat};});
  shuffle(opts);
  return{kind:'spell',speak:w,title:'Which letters spell the vowel?',wordHtml:wordHtml,opts,
    a:opts.findIndex(function(o){return o.ok;}),
    explain:'\u201C'+w+'\u201D '+ipa+' uses '+pat.toUpperCase()+' for /'+v+'/'};
}
function qOQ(word){
  const w=word[0],ipa=word[1],v=word[2];
  const i=w.toLowerCase().indexOf('o');
  const wordHtml=i>=0?esc(w.slice(0,i))+'<u>o</u>'+esc(w.slice(i+1)):esc(w);
  const ks=['\u0252','\u028c','\u025c\u02d0','\u0259'];
  const opts=ks.map(function(k){return{
    html:'<div class="vsym" style="color:'+VOW[k].color+'">/'+k+'/</div><div class="vsub">like '+VOW[k].ex+'</div>',ok:k===v};});
  return{kind:'oq',speak:w,title:'The letter O says\u2026?',wordHtml:wordHtml,opts,
    a:opts.findIndex(function(o){return o.ok;}),
    explain:'\u201C'+w+'\u201D '+ipa+' — the O says /'+v+'/, like '+VOW[v].ex};
}
function qFact(f){
  const opts=f.opts.map(function(t,i){return{html:'<div class="fopt">'+esc(t)+'</div>',ok:i===f.a};});
  shuffle(opts);
  return{kind:'fact',speak:null,title:'Quick fact check!',wordHtml:esc(f.q),opts,
    a:opts.findIndex(function(o){return o.ok;}),explain:f.why||''};
}
function pickWords(filter,n){
  const pool=WORDS.filter(filter).filter(function(w){return canSpeak(w[0]);});
  return shuffle(pool.slice()).slice(0,n);
}
function spellPool(family){
  return WORDS.filter(function(w){
    if(family==='nurse')return w[2]==='\u025c\u02d0';
    if(family==='dress')return w[2]==='e';
    return (w[2]==='\u025c\u02d0'||w[2]==='e');
  }).filter(function(w){return canSpeak(w[0]);});
}
function pairPool(group){
  let pool=PAIRS;
  if(group==='lesson1')pool=PAIRS.filter(function(p){return !p[2];});
  return pool.filter(function(p){return canSpeak(p[0])&&canSpeak(p[1]);});
}
function buildQuiz(cfg){
  let qs=[];
  if(cfg.mode==='sound'){
    const set=cfg.set.vowels;
    pickWords(function(w){return set.indexOf(w[2])>=0&&(!cfg.set.recOnly||w[4]);},cfg.n)
      .forEach(function(w){qs.push(qSound(w,set));});
  }else if(cfg.mode==='pair'){
    shuffle(pairPool(cfg.set.group).slice()).slice(0,cfg.n)
      .forEach(function(p){qs.push(qPair(p));});
  }else if(cfg.mode==='spell'){
    const fam=cfg.set.family;
    shuffle(spellPool(fam).slice()).slice(0,cfg.n)
      .forEach(function(w){qs.push(qSpell(w,fam==='mixed'?(w[2]==='e'?'dress':'nurse'):fam));});
  }else if(cfg.mode==='oq'){
    pickWords(function(w){return w[3]==='o';},cfg.n).forEach(function(w){qs.push(qOQ(w));});
  }else if(cfg.mode==='boss'){
    const snd=VORDER;
    pickWords(function(w){return true;},4).forEach(function(w){qs.push(qSound(w,snd));});
    shuffle(pairPool('all').slice()).slice(0,3).forEach(function(p){qs.push(qPair(p));});
    shuffle(spellPool('mixed').slice()).slice(0,2)
      .forEach(function(w){qs.push(qSpell(w,w[2]==='e'?'dress':'nurse'));});
    pickWords(function(w){return w[3]==='o';},1).forEach(function(w){qs.push(qOQ(w));});
    shuffle(FACTS.slice()).slice(0,2).forEach(function(f){qs.push(qFact(f));});
  }
  return shuffle(qs);
}

/* ---------------- game engine ---------------- */
let GAME=null;
function startQuick(id){
  primeAudio();
  const cfg=QUICK.find(function(q){return q.id===id;});
  startGame({cfg:cfg,career:false,id:id,title:cfg.name});
}
function startLevel(id){
  primeAudio();
  const L=LEVELS.find(function(x){return x.id===id;});
  startGame({cfg:L,career:true,id:id,title:L.name});
}
function startGame(o){
  const qs=buildQuiz(o.cfg);
  if(!qs.length){alert('No voices available for this round. Check Settings (voice mode).');return;}
  GAME={qs:qs,i:0,score:0,streak:0,bestStreak:0,misses:[],cfg:o.cfg,career:o.career,id:o.id,
        title:o.title,answered:false,deadline:0,raf:0,tmo:0};
  renderQuestion();
}
function quitGame(){
  if(GAME){cancelAnimationFrame(GAME.raf);clearTimeout(GAME.tmo);}
  GAME=null;
  if(location.hash==='#levels')showLevels();else goHome();
}
function renderQuestion(){
  const g=GAME;const q=g.qs[g.i];
  g.answered=false;
  const dotHtml=g.qs.map(function(_,i){
    let c='dot';if(i<g.i)c+=' '+(g.qs[i]._ok?'on':'bad');else if(i===g.i)c+=' cur';
    return '<div class="'+c+'" style="'+(i===g.i?'background:#2dd4bf':'')+'"></div>';}).join('');
  const playBtns=q.speak?
    '<div class="playrow">'+
    '<button class="b primary" onclick="speakWord(\''+q.speak.replace(/'/g,"\\'")+'\')">\ud83d\udd0a Play</button>'+
    '<button class="b" onclick="speakWord(\''+q.speak.replace(/'/g,"\\'")+'\',1)">\ud83d\udc22 Slow</button></div>':'';
  const wordHtml=q.wordHtml?'<div class="qword">'+q.wordHtml+'</div>':'';
  const ipa=q.wordHtml&&wobj(q.speak)?'<div class="qipa">'+wobj(q.speak)[1]+'</div>':'';
  const two=q.kind==='pair'?' two':'';
  const opts=q.opts.map(function(o,i){
    return '<button class="opt" id="opt'+i+'" onclick="answer('+i+')">'+o.html+'</button>';}).join('');
  document.getElementById('app').innerHTML=
    '<div class="topbar"><button class="back" onclick="quitGame()">\u2039 Quit</button>'+
    '<div class="meta">Q '+(g.i+1)+'/'+g.qs.length+' · '+esc(g.title)+'</div>'+
    '<div><span class="scorechip">'+g.score+'</span>'+(g.streak>1?' <span class="streakchip">\ud83d\udd25'+g.streak+'</span>':'')+'</div></div>'+
    '<div class="dots">'+dotHtml+'</div>'+
    '<div class="card">'+
      '<div class="qtitle">'+q.title+'</div>'+wordHtml+ipa+playBtns+
      '<div class="opts'+two+'">'+opts+'</div>'+
      '<div class="tbar"><div class="tfill" id="tfill"></div></div>'+
    '</div>'+
    '<div id="fb"></div>';
  g.deadline=Date.now()+g.cfg.time*1000;
  tick();
  if(q.speak){g.tmo=setTimeout(function(){if(GAME&&!GAME.answered)speakWord(q.speak);},360);}
}

function tick(){
  const g=GAME;if(!g||g.answered)return;
  const left=(g.deadline-Date.now())/1000;
  const frac=Math.max(0,Math.min(1,left/g.cfg.time));
  const f=document.getElementById('tfill');
  if(f){
    f.style.transform='scaleX('+frac+')';
    const color = frac>0.5?'var(--good)':(frac>0.25?'var(--amber)':'var(--bad)');
    if (f._lastColor !== color) {
      f.style.background = color;
      f._lastColor = color;
    }
  }
  if(left<=0){answer(-1);return;}
  g.raf=requestAnimationFrame(tick);
}

function answer(i){
  const g=GAME;if(!g||g.answered)return;
  g.answered=true;cancelAnimationFrame(g.raf);clearTimeout(g.tmo);
  const q=g.qs[g.i];
  const frac=Math.max(0,Math.min(1,(g.deadline-Date.now())/1000/g.cfg.time));
  const ok=(i===q.a);
  q._ok=ok;
  let pts=0;
  if(ok){
    const mult=Math.min(2,1+g.streak*0.1);
    pts=Math.round((100+Math.round(100*frac))*mult);
    g.score+=pts;g.streak++;g.bestStreak=Math.max(g.bestStreak,g.streak);
    blip('ok');
  }else{
    g.streak=0;g.misses.push(q);blip('bad');
  }
  q.opts.forEach(function(o,j){
    const el=document.getElementById('opt'+j);
    if(!el)return;
    if(o.ok)el.classList.add('correct');
    else if(j===i)el.classList.add('wrong');
    else el.classList.add('dim');
  });
  const head=ok?('✓ +'+pts+' points'+(g.streak>2?' · streak ×'+g.streak:''))
               :(i===-1?'⏱ Time\u2019s up!':'✗ Not quite');
  const reveal=ok?'':'<div class="why">'+q.explain+'</div>';
  document.getElementById('fb').innerHTML=
    '<div class="fb '+(ok?'ok':'bad')+'">'+head+reveal+
    '<div style="margin-top:10px"><button class="b '+(ok?'primary':'')+'" onclick="nextQ()">Next \u2192</button></div></div>';
  g.tmo=setTimeout(nextQ,ok?1400:3000);
}

function nextQ(){
  const g=GAME;if(!g)return;
  clearTimeout(g.tmo);cancelAnimationFrame(g.raf);
  g.i++;
  if(g.i>=g.qs.length){results();return;}
  renderQuestion();
}

function results(){
  const g=GAME;cancelAnimationFrame(g.raf);clearTimeout(g.tmo);
  const n=g.qs.length,correct=n-g.misses.length,acc=correct/n;
  const stars=acc>=0.9?3:(acc>=0.75?2:(acc>=0.6?1:0));
  if(g.career){
    const p=PROG.levels[g.id]||{stars:0,best:0};
    p.stars=Math.max(p.stars,stars);p.best=Math.max(p.best,g.score);
    PROG.levels[g.id]=p;
  }else{
    PROG.best[g.id]=Math.max(PROG.best[g.id]||0,g.score);
  }
  saveProg();
  const missList=g.misses.length?
    '<div class="h2">Review these \ud83d\udcd6</div>'+
    g.misses.map(function(q){
      const w=q.speak||'\u2014';
      const o=wobj(q.speak);
      return '<div class="miss"><div class="mw"><b>'+esc(String(q.wordHtml||w).replace(/<[^>]+>/g,''))+'</b>'+
        (o?' <span class="mi">'+o[1]+'</span>':'')+
        '<div class="mi">'+esc(q.explain)+'</div></div>'+
        (q.speak?'<button class="mini" onclick="speakWord(\''+String(q.speak).replace(/'/g,"\\'")+'\')">\ud83d\udd0a</button>':'')+
        '</div>';}).join(''):'';
  const isLast=g.career&&g.id==='l8';
  document.getElementById('app').innerHTML=
    '<div class="topbar"><span></span><div class="meta">'+esc(g.title)+'</div><button class="back" onclick="goHome()">Home \u2192</button></div>'+
    '<div class="card" style="text-align:center">'+
      '<div class="bigstars">'+'\u2605'.repeat(stars)+'\u2606'.repeat(3-stars)+'</div>'+
      '<div class="bigscore">'+g.score+'</div>'+
      '<div class="acc">'+correct+'/'+n+' correct · best streak '+g.bestStreak+
      (acc===1?' · flawless! \ud83c\udf89':'')+'</div>'+
      '<div class="rowbtns">'+
        '<button class="b" onclick="start'+(g.career?'Level':'Quick')+'(\''+g.id+'\')">Retry</button>'+
        (g.career&&!isLast&&stars>0?'<button class="b primary" onclick="nextLevel(\''+g.id+'\')">Next level \u2192</button>':'')+
      '</div>'+
    '</div>'+missList;
}

function nextLevel(id){
  const i=LEVELS.findIndex(function(x){return x.id===id;});
  if(i>=0&&i<LEVELS.length-1)startLevel(LEVELS[i+1].id);
}

/* ---------------- screens ---------------- */
function goHome(){
  if(GAME){cancelAnimationFrame(GAME.raf);clearTimeout(GAME.tmo);}
  GAME=null;location.hash='';
  const total=Object.keys(PROG.levels).reduce(function(a,k){return a+(PROG.levels[k].stars||0);},0);
  document.getElementById('app').innerHTML=
    '<div class="hero"><div class="hkick">BRITISH ENGLISH \u00b7 RP</div>'+
    '<h1>Vowel&nbsp;Quest</h1><div class="hsub">Hear it. Say it. Win it.</div></div>'+
    '<div class="card lvl" onclick="showLevels()">'+
      '<div class="lnum">\ud83d\uddfa</div>'+
      '<div class="lvlmain"><div class="lt">Career Mode</div>'+
      '<div class="ld">8 levels — from best vs burst to the boss battle</div></div>'+
      '<div class="stars">\u2605 '+total+'/24</div></div>'+
    '<div class="grid2">'+QUICK.map(function(q){
      return '<button class="tile" onclick="startQuick(\''+q.id+'\')">'+
        '<div class="tic">'+q.ic+'</div><div class="tt">'+q.name+'</div><div class="td">'+q.desc+'</div></button>';
    }).join('')+'</div>'+
    '<div class="rowbtns"><button class="b" onclick="showRef()">\ud83d\udcd6 The Sounds</button>'+
    '<button class="b" onclick="showSettings()">\u2699\ufe0f Settings</button></div>'+
    '<div class="foot">son = sun \u00b7 burst = term \u00b7 the R is silent — you know the drills.</div>';
}

function showLevels(){
  if(GAME){cancelAnimationFrame(GAME.raf);clearTimeout(GAME.tmo);}
  GAME=null;location.hash='levels';
  const rows=LEVELS.map(function(L,i){
    const p=PROG.levels[L.id];const st=p?p.stars:0;
    const unlocked=i===0||(PROG.levels[LEVELS[i-1].id]&&PROG.levels[LEVELS[i-1].id].stars>=1);
    return '<div class="card lvl'+(unlocked?'':' locked')+'"'+(unlocked?' onclick="startLevel(\''+L.id+'\')"':'')+'>'+
      '<div class="lnum">'+(i+1)+'</div>'+
      '<div class="lvlmain"><div class="lt">'+(unlocked?esc(L.name):'\ud83d\udd12 '+esc(L.name))+'</div>'+
      '<div class="ld">'+esc(L.desc)+' \u00b7 '+L.n+' questions'+(unlocked?'':' · earn a star to unlock')+'</div></div>'+
      '<div class="stars">'+'\u2605'.repeat(st)+'\u2606'.repeat(3-st)+'</div></div>';
  }).join('');
  document.getElementById('app').innerHTML=
    '<div class="topbar"><button class="back" onclick="goHome()">\u2039 Home</button>'+
    '<div class="meta">Career Mode</div><span></span></div>'+rows+
    '<div class="foot">Earn at least \u2605 to unlock the next level.</div>';
}

function showRef(){
  if(GAME){cancelAnimationFrame(GAME.raf);clearTimeout(GAME.tmo);}GAME=null;
  const cards=VORDER.map(function(k){
    const v=VOW[k];
    return '<div class="card vcard">'+
      '<div class="vsym-big" style="color:'+v.color+'">/'+k+'/</div>'+
      '<div class="vinfo"><div class="vname">'+v.name+' — '+v.tag+'</div>'+
      '<div class="vex"><button class="mini" onclick="speakWord(\''+v.ex+'\')">\ud83d\udd0a '+v.ex+'</button>'+
      (wobj(v.ex)?' <span class="mi">'+wobj(v.ex)[1]+'</span>':'')+'</div></div></div>';
  }).join('');
  const facts=
    '<div class="h2">Famous facts</div><div class="card note">'+
    '\u2022 <b>son = sun</b> — /s\u028cn/. Homophones, like fun and done.<br>'+
    '\u2022 <b>burst = term</b> — both /b\u025c\u02d0\u2026/ family: the long central vowel with a <b>silent R</b>.<br>'+
    '\u2022 <b>/\u025c\u02d0/ is the schwa\u2019s big brother</b> — sofa \u2192 sir: same relaxed mouth, longer and stronger.<br>'+
    '\u2022 <b>The tricky O</b> — hot says /\u0252/, but love, son and money say /\u028c/.<br>'+
    '\u2022 <b>/e/ hides in spellings</b> — head (ea), said (ai), friend (ie).<br>'+
    '\u2022 <b>/\u0259/ never carries stress</b> — CAM-uh-ruh.'+
    '</div>'+
    '<div class="h2">Tip</div><div class="card note">On iPhone, Android or PC, bookmark this page or choose '+
    '<b>Add to Home Screen</b> — Vowel Quest runs instantly like an app.</div>';
  document.getElementById('app').innerHTML=
    '<div class="topbar"><button class="back" onclick="goHome()">\u2039 Home</button>'+
    '<div class="meta">The Sounds</div><span></span></div>'+cards+facts;
}

function showSettings(){
  if(GAME){cancelAnimationFrame(GAME.raf);clearTimeout(GAME.tmo);}GAME=null;
  document.getElementById('app').innerHTML=
    '<div class="topbar"><button class="back" onclick="goHome()">\u2039 Home</button>'+
    '<div class="meta">Settings</div><span></span></div>'+
    '<div class="card">'+
      '<div class="setrow"><div class="setlab">\ud83d\udce3 Voice</div>'+
      '<div class="segs">'+
        '<button class="seg '+(SETTINGS.voice==='auto'?'on':'')+'" onclick="setVoice(\'auto\')">Studio voice + device</button>'+
        '<button class="seg '+(SETTINGS.voice==='browser'?'on':'')+'" onclick="setVoice(\'browser\')">Device only</button>'+
      '</div></div>'+
      '<div class="note">Studio voice: recorded British narrator (lesson-two words). Device voice: phone/PC built-in speech (used automatically for lesson-one words).</div>'+
      '<div class="setrow"><div class="setlab">\ud83d\udc22 Speed</div>'+
      '<div class="segs">'+
        '<button class="seg '+(SETTINGS.rate===1?'on':'')+'" onclick="setRate(1)">Normal</button>'+
        '<button class="seg '+(SETTINGS.rate===0.75?'on':'')+'" onclick="setRate(0.75)">Slow</button>'+
      '</div></div>'+
      '<div class="setrow"><div class="setlab">\ud83d\udea8 Progress</div>'+
      '<button class="b danger" onclick="resetProg()">Reset</button></div>'+
    '</div>';
}

function setVoice(v){SETTINGS.voice=v;saveSettings();showSettings();}
function setRate(r){SETTINGS.rate=r;saveSettings();showSettings();}
function resetProg(){
  if(confirm('Reset all stars and best scores?')){
    PROG={levels:{},best:{}};saveProg();goHome();
  }
}

/* boot */
goHome();
</script>
</body>
</html>
